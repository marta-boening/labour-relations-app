<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Labour Relations Experte</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:           #f0efe9;
      --surface:      #ffffff;
      --surface-alt:  #f7f7f6;
      --border:       #e0dfd8;
      --border-hover: #c8c7bf;
      --text:         #1a1a18;
      --text-muted:   #5a5a56;
      --text-subtle:  #8a8a85;
      --dark:         #1a1a18;
      --radius:       16px;
      --radius-sm:    10px;
      --shadow:       0 2px 8px rgba(0,0,0,0.06);
      --shadow-lg:    0 4px 20px rgba(0,0,0,0.10);
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.7;
    }

    /* ── Layout ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 28px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 30px;
      height: 30px;
      background: var(--dark);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 16px;
      height: 16px;
      color: #fff;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .header-title span {
      color: var(--text-subtle);
      font-weight: 400;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-subtle);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Session bar ── */
    .session-bar {
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      padding: 5px 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .session-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .session-id {
      font-size: 11px;
      font-family: "SF Mono", "Fira Code", monospace;
      color: var(--text-muted);
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 99px;
    }

    /* ── Welcome ── */
    .welcome {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem 2.5rem;
      text-align: center;
      margin-bottom: 8px;
    }

    .welcome-icon {
      width: 48px;
      height: 48px;
      background: var(--dark);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .welcome-icon svg {
      width: 24px;
      height: 24px;
      color: #fff;
    }

    .welcome h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .welcome p {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.7;
      max-width: 460px;
      margin: 0 auto;
    }

    /* ── Bubbles ── */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .avatar-bot {
      background: var(--dark);
      color: #fff;
    }

    .avatar-user {
      background: var(--border-hover);
      color: var(--text);
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 68%;
      gap: 3px;
    }

    .message-row.user .bubble-wrap {
      align-items: flex-end;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .bubble-user {
      background: var(--dark);
      color: #fff;
      border-bottom-right-radius: var(--radius-sm);
    }

    .bubble-bot {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }

    .bubble-error {
      background: #fff5f5;
      color: #c0392b;
      border: 1px solid #ffd5d5;
    }

    .message-row.bot .bubble-wrap {
      max-width: 94%;
    }

    .bubble-bot h1, .bubble-bot h2, .bubble-bot h3 {
      margin: 14px 0 6px;
      line-height: 1.35;
    }
    .bubble-bot h1:first-child, .bubble-bot h2:first-child, .bubble-bot h3:first-child {
      margin-top: 0;
    }
    .bubble-bot h1 { font-size: 17px; }
    .bubble-bot h2 { font-size: 16px; }
    .bubble-bot h3 { font-size: 14.5px; }
    .bubble-bot p { margin: 8px 0; }
    .bubble-bot p:first-child { margin-top: 0; }
    .bubble-bot p:last-child { margin-bottom: 0; }
    .bubble-bot ul, .bubble-bot ol { margin: 8px 0; padding-left: 22px; }
    .bubble-bot li { margin: 3px 0; }
    .bubble-bot hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .bubble-bot code {
      background: var(--surface-alt);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 12.5px;
    }
    .bubble-bot table {
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 12.5px;
      display: block;
      overflow-x: auto;
      max-width: 100%;
    }
    .bubble-bot th, .bubble-bot td {
      border: 1px solid var(--border);
      padding: 5px 9px;
      text-align: left;
    }
    .bubble-bot th {
      background: var(--surface-alt);
    }
    .bubble-bot blockquote {
      border-left: 3px solid var(--border-hover);
      margin: 8px 0;
      padding: 2px 12px;
      color: var(--text-muted);
    }

    .timestamp {
      font-size: 10px;
      color: var(--text-subtle);
      padding: 0 4px;
    }

    /* ── Typing indicator ── */
    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-subtle);
      animation: typing 1.3s ease-in-out infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.18s; }
    .typing-dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0);   opacity: 0.4; }
      30%            { transform: translateY(-4px); opacity: 1; }
    }

    /* ── Input area ── */
    .input-area {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 14px 24px 18px;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 11px 18px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      line-height: 1.5;
      max-height: 130px;
      min-height: 44px;
    }

    .input-field::placeholder {
      color: var(--text-subtle);
    }

    .input-field:focus {
      border-color: var(--border-hover);
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 50%;
      background: var(--dark);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s, opacity 0.12s, background 0.12s;
    }

    .send-btn:hover:not(:disabled) {
      background: #333330;
      transform: scale(1.05);
    }

    .send-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    .mic-btn {
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.12s, background 0.12s, border-color 0.12s, color 0.12s;
    }

    .mic-btn:hover:not(:disabled) {
      border-color: var(--border-hover);
      color: var(--text);
    }

    .mic-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .mic-btn.recording {
      background: #c0392b;
      border-color: #c0392b;
      color: #fff;
      animation: mic-pulse 1.4s ease-in-out infinite;
    }

    @keyframes mic-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(192,57,43,0.4); }
      50% { box-shadow: 0 0 0 6px rgba(192,57,43,0); }
    }

    .mic-btn svg {
      width: 18px;
      height: 18px;
    }

    .input-hint {
      font-size: 11px;
      color: var(--text-subtle);
      margin-top: 7px;
      text-align: right;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .header { padding: 0 16px; }
      .session-bar { padding: 5px 16px; }
      .messages { padding: 18px 14px; }
      .input-area { padding: 12px 14px 16px; }
      .bubble-wrap { max-width: 82%; }
      .welcome { padding: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 3v1m0 16v1M4.22 4.22l.71.71m13.44 13.44.71.71M3 12H4m16 0h1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M9 12a3 3 0 116 0 3 3 0 01-6 0z"/>
        </svg>
      </div>
      <div class="header-title">Labour Relations <span>Experte</span></div>
    </div>
    <div class="status-indicator">
      <div class="status-dot"></div>
      Online
    </div>
  </header>

  <!-- Session bar -->
  <div class="session-bar">
    <span class="session-label">Sitzung</span>
    <span class="session-id" id="sessionIdDisplay"></span>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages">
    <div class="welcome">
      <div class="welcome-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-3 3-3-3z"/>
        </svg>
      </div>
      <h2>Wie kann ich helfen?</h2>
      <p>Ihr Experte für Arbeitsrecht, Betriebsverfassung und Personalmanagement — stellen Sie Ihre Frage.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-row">
      <textarea
        id="inputField"
        class="input-field"
        placeholder="Frage eingeben ..."
        rows="1"
        maxlength="2000"
      ></textarea>
      <button class="mic-btn" id="micBtn" title="Diktieren">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/>
        </svg>
      </button>
      <button class="send-btn" id="sendBtn" title="Senden">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
    <div class="input-hint" id="inputHint">Enter zum Senden &nbsp;·&nbsp; Shift+Enter = neue Zeile</div>
  </div>

</div>

<script>
  // ── Session ID ──────────────────────────────────────────────────────────────
  const SESSION_ID = 'sess-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);
  document.getElementById('sessionIdDisplay').textContent = SESSION_ID;

  // ── DOM refs ────────────────────────────────────────────────────────────────
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('inputField');
  const sendBtn    = document.getElementById('sendBtn');
  const micBtn     = document.getElementById('micBtn');
  const inputHint  = document.getElementById('inputHint');

  // ── Spracherkennung (Diktieren) ─────────────────────────────────────────────
  const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognitionAPI) {
    micBtn.disabled = true;
    micBtn.title = 'Diktieren wird von diesem Browser nicht unterstützt (z.B. Chrome oder Edge verwenden)';
  } else {
    const recognition = new SpeechRecognitionAPI();
    recognition.lang = 'de-DE';
    recognition.continuous = true;
    recognition.interimResults = true;

    let isRecording = false;
    let baseText = ''; // Text, der schon im Feld stand, bevor die Aufnahme startete

    recognition.addEventListener('result', (e) => {
      let finalTranscript = '';
      let interimTranscript = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const transcript = e.results[i][0].transcript;
        if (e.results[i].isFinal) {
          finalTranscript += transcript;
        } else {
          interimTranscript += transcript;
        }
      }
      if (finalTranscript) {
        baseText = (baseText ? baseText + ' ' : '') + finalTranscript.trim();
      }
      inputEl.value = (baseText + ' ' + interimTranscript).trim();
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
    });

    recognition.addEventListener('end', () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      inputHint.textContent = 'Enter zum Senden  ·  Shift+Enter = neue Zeile';
      inputEl.focus();
    });

    recognition.addEventListener('error', (e) => {
      isRecording = false;
      micBtn.classList.remove('recording');
      const messages = {
        'not-allowed': 'Mikrofon-Zugriff wurde verweigert. Bitte in den Browser-Einstellungen erlauben.',
        'no-speech': 'Keine Sprache erkannt.',
        'audio-capture': 'Kein Mikrofon gefunden.'
      };
      inputHint.textContent = messages[e.error] || `Diktieren fehlgeschlagen: ${e.error}`;
      setTimeout(() => { inputHint.textContent = 'Enter zum Senden  ·  Shift+Enter = neue Zeile'; }, 4000);
    });

    micBtn.addEventListener('click', () => {
      if (isRecording) {
        recognition.stop();
        return;
      }
      baseText = inputEl.value.trim();
      isRecording = true;
      micBtn.classList.add('recording');
      inputHint.textContent = '🎙️ Aufnahme läuft … zum Beenden nochmal klicken';
      try {
        recognition.start();
      } catch (err) {
        isRecording = false;
        micBtn.classList.remove('recording');
      }
    });
  }

  // ── Auto-resize textarea ────────────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
  });

  // ── Enter to send ───────────────────────────────────────────────────────────
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  // ── Core send function ──────────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';

    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    appendBubble('user', text);
    setLoading(true);
    const typingId = appendTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId: SESSION_ID, userId: 'marta-boening' })
      });

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const data = await res.json();
      const replyText = data.output ?? '(leere Antwort)';

      removeTyping(typingId);
      appendBubble('bot', replyText, false, data.html);

    } catch (err) {
      removeTyping(typingId);
      const msg = err.message.includes('Failed to fetch')
        ? 'Verbindung zum Server fehlgeschlagen. Läuft der Server (npm start in server/)?'
        : `Fehler: ${err.message}`;
      appendBubble('bot', msg, true);
    } finally {
      setLoading(false);
      inputEl.focus();
    }
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function setLoading(on) {
    sendBtn.disabled = on;
    inputEl.disabled = on;
  }

  function now() {
    return new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  }

  function appendBubble(who, text, isError = false, html = null) {
    const row = document.createElement('div');
    row.className = `message-row ${who}`;

    const avatarEl = document.createElement('div');
    avatarEl.className = `avatar avatar-${who === 'user' ? 'user' : 'bot'}`;
    avatarEl.textContent = who === 'user' ? 'Du' : 'LR';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = `bubble bubble-${who === 'user' ? 'user' : 'bot'}${isError ? ' bubble-error' : ''}`;
    if (html && !isError) {
      bubble.innerHTML = html;
    } else {
      bubble.textContent = text;
    }

    const ts = document.createElement('span');
    ts.className = 'timestamp';
    ts.textContent = now();

    wrap.appendChild(bubble);
    wrap.appendChild(ts);
    row.appendChild(avatarEl);
    row.appendChild(wrap);

    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function appendTyping() {
    const id = 'typing-' + Date.now();
    const row = document.createElement('div');
    row.className = 'message-row bot';
    row.id = id;

    const avatarEl = document.createElement('div');
    avatarEl.className = 'avatar avatar-bot';
    avatarEl.textContent = 'LR';

    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'bubble bubble-bot typing-bubble';
    bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

    wrap.appendChild(bubble);
    row.appendChild(avatarEl);
    row.appendChild(wrap);
    messagesEl.appendChild(row);
    scrollToBottom();
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
</script>
</body>
</html>
